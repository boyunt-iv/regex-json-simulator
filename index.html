<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex JSON Simulator</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons ผ่าน CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ซ่อน Scrollbar บางส่วนให้ดูสะอาดตาแบบ Mac */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 p-6 font-sans text-gray-800">
    <div class="w-full mx-auto space-y-6">
        
        <!-- Header Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
            <div class="flex items-center gap-3 mb-2">
                <i data-lucide="code" class="text-blue-600 w-7 h-7"></i>
                <h1 class="text-2xl font-bold text-gray-900">Regex JSON Simulator</h1>
            </div>
            <p class="text-gray-600 mb-4">
                เครื่องมือสำหรับทดสอบการ Extract ค่า จากโครงสร้างคล้าย JSON (แก้ไข Regex ด้านล่างได้เลย)
            </p>
            
            <div class="flex flex-col sm:flex-row gap-2">
                <div class="flex-1 flex items-center bg-gray-50 rounded-lg border border-gray-300 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-200 overflow-hidden transition-all">
                    <span class="px-4 py-3 text-gray-500 font-mono text-lg bg-gray-200 border-r border-gray-300 select-none">/</span>
                    <input
                        type="text"
                        id="patternInput"
                        class="flex-1 p-3 font-mono text-sm text-pink-600 bg-transparent outline-none w-full"
                        value=":(?=(?:[^&quot;]*&quot;[^&quot;]*&quot;)*[^&quot;]*\Z)\s*(-?\d+\.\d+)(?=\s*[,}\]])"
                        placeholder="พิมพ์ Regex Pattern ที่นี่..."
                        spellcheck="false"
                    />
                    <span class="px-4 py-3 text-gray-500 font-mono text-lg bg-gray-200 border-l border-gray-300 select-none">/</span>
                    <input
                        type="text"
                        id="flagsInput"
                        class="w-24 p-3 font-mono text-sm text-gray-700 bg-gray-50 outline-none placeholder-gray-400"
                        value="g"
                        placeholder="flags"
                        spellcheck="false"
                    />
                </div>
            </div>
        </div>

        <!-- Main Content: 3-Zone Split View -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 xl:gap-6">
            
            <!-- Zone 1: Input Panel -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl flex justify-between items-center">
                    <div class="flex items-center gap-2 font-semibold text-gray-700">
                        <i data-lucide="file-json" class="w-[18px] h-[18px]"></i>
                        <span>JSON / Text Input</span>
                    </div>
                    <button 
                        id="runBtn"
                        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors disabled:opacity-50 shrink-0"
                    >
                        <i id="runIcon" data-lucide="play" class="w-4 h-4"></i>
                        <span id="runText">Run Regex</span>
                    </button>
                </div>
                <textarea
                    id="jsonInput"
                    class="flex-1 w-full p-4 font-mono text-sm bg-gray-900 text-green-400 resize-none focus:outline-none rounded-b-xl"
                    placeholder="Paste your large JSON payload here..."
                    spellcheck="false"
                ></textarea>
            </div>

            <!-- Zone 2: Matches Panel -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl">
                    <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-[18px] h-[18px] text-green-600"></i>
                        Execution Result
                    </h2>
                </div>
                
                <div id="matchesContainer" class="flex-1 p-4 overflow-y-auto bg-gray-50">
                    <!-- Default State -->
                    <div class="h-full flex flex-col items-center justify-center text-gray-400">
                        <i data-lucide="play" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p>คลิก "Run Regex" เพื่อดูผลลัพธ์</p>
                    </div>
                </div>
            </div>

            <!-- Zone 3: JSON Result Panel -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[600px]">
                <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl flex justify-between items-center">
                    <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                        <i data-lucide="code" class="w-[18px] h-[18px] text-blue-600"></i>
                        JSON Result
                    </h2>
                    
                    <div class="flex items-center gap-3">
                        <!-- Toggle Show Diff -->
                        <label class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer hover:text-gray-900 transition-colors select-none">
                            <input type="checkbox" id="showDiffToggle" disabled class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 disabled:opacity-50 cursor-pointer w-4 h-4">
                            <span>Show Diff</span>
                            <span id="diffBadge" class="hidden bg-red-300 text-yellow-800 text-[10px] px-1.5 py-0.5 rounded-full font-bold shadow-sm">0</span>
                        </label>
                        
                        <div class="w-px h-4 bg-gray-300"></div>

                        <button
                            id="copyBtn"
                            disabled
                            class="flex items-center gap-1 text-xs font-medium text-gray-500 hover:text-blue-600 transition-colors bg-white px-2 py-1 rounded border border-gray-300 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <i id="copyIcon" data-lucide="copy" class="w-[14px] h-[14px]"></i>
                            <span id="copyText">Copy JSON</span>
                        </button>
                    </div>
                </div>
                
                <div id="jsonResultContainer" class="flex-1 bg-gray-900 rounded-b-xl p-4 overflow-auto flex flex-col">
                    <!-- Default State -->
                    <div class="h-full flex flex-col items-center justify-center text-gray-600 flex-1">
                        <i data-lucide="code" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p class="text-sm">ผลลัพธ์ JSON จะแสดงที่นี่</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Summary Section (Footer) -->
        <div id="summarySection" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col mb-10">
            <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl flex justify-between items-center">
                <h2 class="font-semibold text-gray-700 flex items-center gap-2">
                    <i data-lucide="bar-chart-2" class="w-[18px] h-[18px] text-purple-600"></i>
                    Summary Change
                </h2>
                <span id="summaryTotalMatches" class="text-xs font-bold text-gray-500 bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">Total: 0</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b border-gray-200">
                        <tr>
                            <th scope="col" class="px-6 py-3 cursor-pointer hover:bg-gray-200 select-none transition-colors" onclick="handleSort('type')">
                                <div class="flex items-center gap-1">Data Type <i id="sortIcon-type" data-lucide="arrow-up-down" class="w-3 h-3 text-gray-400"></i></div>
                            </th>
                            <th scope="col" class="px-6 py-3 cursor-pointer hover:bg-gray-200 select-none transition-colors" onclick="handleSort('value')">
                                <div class="flex items-center gap-1">Value <i id="sortIcon-value" data-lucide="arrow-up-down" class="w-3 h-3 text-gray-400"></i></div>
                            </th>
                            <th scope="col" class="px-6 py-3 cursor-pointer hover:bg-gray-200 select-none transition-colors" onclick="handleSort('count')">
                                <div class="flex items-center gap-1">Match Count <i id="sortIcon-count" data-lucide="arrow-up-down" class="w-3 h-3 text-gray-400"></i></div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // เริ่มต้น Render ไอคอน
        lucide.createIcons();

        // ตัวแปรเก็บข้อมูล
        let currentRawJsonString = null;     // JSON คลีนๆ สำหรับ Copy
        let currentNormalHtml = null;        // HTML สำหรับแสดงผลปกติ
        let currentHighlightedHtml = null;   // HTML สำหรับแสดงผลแบบ Highlight
        let currentSummaryData = [];         // ข้อมูลสำหรับ Summary Table
        let sortCol = 'count';               // คอลัมน์ที่ใช้ Sort เริ่มต้น
        let sortDesc = true;                 // ทิศทางการ Sort เริ่มต้น

        // ดึง DOM Elements
        const patternInput = document.getElementById('patternInput');
        const flagsInput = document.getElementById('flagsInput');
        const jsonInput = document.getElementById('jsonInput');
        const runBtn = document.getElementById('runBtn');
        const runIcon = document.getElementById('runIcon');
        const runText = document.getElementById('runText');
        const copyBtn = document.getElementById('copyBtn');
        const copyIcon = document.getElementById('copyIcon');
        const copyText = document.getElementById('copyText');
        const matchesContainer = document.getElementById('matchesContainer');
        const jsonResultContainer = document.getElementById('jsonResultContainer');
        const showDiffToggle = document.getElementById('showDiffToggle');
        const diffBadge = document.getElementById('diffBadge');
        const summarySection = document.getElementById('summarySection');
        const summaryTableBody = document.getElementById('summaryTableBody');
        const summaryTotalMatches = document.getElementById('summaryTotalMatches');

        // ตั้งค่า Input เริ่มต้น
        jsonInput.value = `{
    "group1_numbers_match": {
        "_description": "ทศนิยมเหล่านี้จะถูกจับและครอบด้วย Double Quote",
        "standard_decimal": 10.50,
        "negative_decimal": -5.25,
        "zero_leading_decimal": 0.05,
        "weird_spacing_decimal" :    3.14159   
    },
    "group2_numbers_not_match": {
        "_description": "ตัวเลขที่ไม่เข้าเงื่อนไขทศนิยม",
        "standard_integer": 30,
        "negative_integer": -100,
        "scientific_notation": 5.97e24
    },
    "group3_strings_and_fake_json_not_match": {
        "_description": "ข้อความทั้งหมดรวมถึง JSON ที่ถูกแปลงเป็น String",
        "normal_string": "Hello Bank World",
        "string_with_decimal": "99.99",
        "fake_json_object": "{\\"inner_value\\": 12.34, \\"status\\": true}",
        "fake_json_array": "[1.1, 2.2, 3.3]",
        "fake_json_mixed": "[{\\"id\\": 1, \\"score\\": 4.5}]"
    },
    "group4_booleans_and_null_not_match": {
        "_description": "ค่าความจริงและค่าว่าง",
        "boolean_true": true,
        "boolean_false": false,
        "null_value": null
    },
    "group5_arrays_not_match": {
        "_description": "ข้อมูลใน Array จะไม่ถูกจับเพราะไม่มีเครื่องหมาย : นำหน้า",
        "array_integers": [1, 2, 3],
        "array_decimals": [13.75, 100.50, -5.55],
        "array_mixed": ["text", true, null, 9.99, [1.1, 2.2]],
        "array_of_objects": [
            {
                "id": 1,
                "rate_MATCH": 1.25
            },
            {
                "id": 2,
                "rate_MATCH": 2.50
            }
        ]
    },
    "group6_nested_objects_mixed": {
        "_description": "ออบเจกต์ซ้อนทับกัน",
        "nested_level_1": {
            "level1_string": "test data",
            "level1_decimal_MATCH": 77.77,
            "level1_array_NOT_MATCH": [8.88, 9.99],
            "nested_level_2": {
                "level2_decimal_MATCH": 123.456,
                "level2_null_NOT_MATCH": null
            }
        }
    }
}`;

        // Helper Function หนีบ HTML (ป้องกัน XSS/UI พัง)
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ฟังก์ชันอัปเดตหน้าจอ JSON ตามสถานะ Checkbox
        function updateJsonView() {
            if (!currentNormalHtml) return;
            if (showDiffToggle.checked) {
                jsonResultContainer.innerHTML = `<pre class="text-green-400 font-mono text-sm leading-relaxed">${currentHighlightedHtml}</pre>`;
            } else {
                jsonResultContainer.innerHTML = `<pre class="text-green-400 font-mono text-sm leading-relaxed">${currentNormalHtml}</pre>`;
            }
        }

        // เมื่อกด Checkbox Show Diff
        showDiffToggle.addEventListener('change', updateJsonView);

        // ฟังก์ชันจัดการการคลิก Header ของตาราง Summary
        window.handleSort = function(col) {
            if (sortCol === col) {
                sortDesc = !sortDesc; // เปลี่ยนทิศทางถ้ากดคอลัมน์เดิม
            } else {
                sortCol = col;
                sortDesc = (col === 'count'); // ถ้าเป็น count ให้ตั้งต้นเป็นมากไปน้อย ส่วน text ให้น้อยไปมาก
            }
            renderSummaryTable();
        };

        // ฟังก์ชันเรนเดอร์ข้อมูลลงในตาราง Summary
        function renderSummaryTable() {
            if (!currentSummaryData || currentSummaryData.length === 0) {
                summarySection.classList.add('hidden');
                return;
            }
            
            summarySection.classList.remove('hidden');
            
            // 1. จัดเรียงข้อมูล (Sort)
            const sortedData = [...currentSummaryData].sort((a, b) => {
                let valA = a[sortCol];
                let valB = b[sortCol];
                
                if (sortCol === 'value' || sortCol === 'type') {
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    if (valA < valB) return sortDesc ? 1 : -1;
                    if (valA > valB) return sortDesc ? -1 : 1;
                    return 0;
                } else {
                    return sortDesc ? valB - valA : valA - valB;
                }
            });

            // 2. อัปเดตไอคอนลูกศรบนหัวตาราง
            ['type', 'value', 'count'].forEach(col => {
                const icon = document.getElementById(`sortIcon-${col}`);
                if (icon) {
                    if (sortCol === col) {
                        icon.setAttribute('data-lucide', sortDesc ? 'arrow-down' : 'arrow-up');
                        icon.classList.remove('text-gray-400');
                        icon.classList.add('text-blue-600');
                    } else {
                        icon.setAttribute('data-lucide', 'arrow-up-down');
                        icon.classList.remove('text-blue-600');
                        icon.classList.add('text-gray-400');
                    }
                }
            });

            // 3. วาด Row ของตาราง
            summaryTableBody.innerHTML = sortedData.map(row => `
                <tr class="bg-white border-b hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-3 w-32">
                        <span class="px-2 py-1 rounded text-[11px] font-bold uppercase tracking-wider ${row.type === 'numeric' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">
                            ${row.type}
                        </span>
                    </td>
                    <td class="px-6 py-3 font-mono text-pink-600 font-medium whitespace-pre-wrap break-all">${escapeHtml(row.value)}</td>
                    <td class="px-6 py-3 font-bold text-gray-700 w-32 text-center">${row.count}</td>
                </tr>
            `).join('');
            
            // รวมจำนวน Matches แบบ Unique และแบบทั้งหมด
            const totalMatches = currentSummaryData.reduce((acc, curr) => acc + curr.count, 0);
            summaryTotalMatches.textContent = `Total Matches: ${totalMatches} (Unique: ${currentSummaryData.length})`;
            
            lucide.createIcons(); // วาดไอคอนใหม่
        }

        // ฟังก์ชันเมื่อกด Copy
        copyBtn.addEventListener('click', () => {
            if (!currentRawJsonString) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = currentRawJsonString; // ใช้ก้อนที่ไม่มี HTML Highlight
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                copyIcon.setAttribute('data-lucide', 'check');
                copyIcon.classList.add('text-green-600');
                copyText.textContent = 'Copied!';
                lucide.createIcons();
                
                setTimeout(() => {
                    copyIcon.setAttribute('data-lucide', 'copy');
                    copyIcon.classList.remove('text-green-600');
                    copyText.textContent = 'Copy JSON';
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        });

        // ฟังก์ชันหลักที่รัน Regex
        runBtn.addEventListener('click', () => {
            const inputText = jsonInput.value;
            if (!inputText) return;

            runBtn.disabled = true;
            runText.innerHTML = '<span class="animate-pulse">Processing...</span>';
            runIcon.style.display = 'none';

            setTimeout(() => {
                try {
                    const rawPattern = patternInput.value;
                    const pattern = rawPattern.replace(/\\Z/g, '$'); // รองรับ Regex Python/Java
                    const flags = flagsInput.value;
                    const regex = new RegExp(pattern, flags);
                    
                    const matches = [];
                    let match;
                    
                    // --- 1. หา Matches แบบปกติ ---
                    if (!regex.global) {
                        match = regex.exec(inputText);
                        if (match) {
                            matches.push({
                                fullMatch: match[0],
                                capturedValue: match.length > 1 ? match[1] : match[0],
                                index: match.index
                            });
                        }
                    } else {
                        while ((match = regex.exec(inputText)) !== null) {
                            matches.push({
                                fullMatch: match[0],
                                capturedValue: match.length > 1 ? match[1] : match[0],
                                index: match.index
                            });
                        }
                    }

                    // --- 2. สร้าง Structured JSON Result ---
                    let structuredOutput = null;
                    try {
                        const parsedInput = JSON.parse(inputText);
                        const marker = "@@RGX_MATCH@@";
                        
                        const regexGlobalForReplace = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');
                        const modifiedText = inputText.replace(regexGlobalForReplace, (m, ...args) => {
                            const captured = args.length > 2 ? args[0] : m;
                            const idx = m.lastIndexOf(captured);
                            
                            if (idx !== -1) {
                                const prevChar = m.charAt(idx - 1);
                                const nextChar = m.charAt(idx + captured.length);
                                
                                if (prevChar === '"' && nextChar === '"') {
                                    return m.substring(0, idx) + `${marker}${captured}` + m.substring(idx + captured.length);
                                } else {
                                    return m.substring(0, idx) + `"${marker}${captured}"` + m.substring(idx + captured.length);
                                }
                            }
                            return m;
                        });

                        // จัดกลุ่มสำหรับ Summary Table (Group By Value)
                        const summaryMap = {};
                        matches.forEach(m => {
                            const val = m.capturedValue;
                            if(!summaryMap[val]) {
                                // เช็คว่าเป็นตัวเลขหรือไม่ (รวมเช็คว่าเป็นข้อความว่างๆ ไหมด้วย)
                                const isNumeric = !isNaN(val) && !isNaN(parseFloat(val));
                                summaryMap[val] = {
                                    type: isNumeric ? 'numeric' : 'text',
                                    value: val,
                                    count: 0
                                };
                            }
                            summaryMap[val].count += 1;
                        });
                        currentSummaryData = Object.values(summaryMap);

                        const modifiedParsed = JSON.parse(modifiedText);

                        const buildFinalOutput = (origNode, modNode) => {
                            if (Array.isArray(origNode)) {
                                return origNode.map((item, i) => buildFinalOutput(item, modNode[i]));
                            } else if (origNode !== null && typeof origNode === 'object') {
                                const obj = {};
                                for (let k in origNode) {
                                    obj[k] = buildFinalOutput(origNode[k], modNode[k]);
                                }
                                return obj;
                            } else {
                                if (typeof modNode === 'string' && modNode.includes(marker)) {
                                    const extractedValue = modNode.replace(marker, "");
                                    // ฝัง Marker ลับๆ ไว้สำหรับทำ Highlight ตอน Render UI
                                    return `@@@_HL_START_@@@${extractedValue}@@@_HL_END_@@@`;
                                }
                                return origNode;
                            }
                        };

                        structuredOutput = buildFinalOutput(parsedInput, modifiedParsed);
                        
                    } catch (err) {
                        structuredOutput = matches.length > 0 
                            ? matches.map(m => m.capturedValue) 
                            : { warning: "Input is not valid JSON or Regex broke the structure." };
                    }

                    // --- 3. Render ผลลัพธ์ (Matches Panel) ---
                    if (matches.length > 0) {
                        let html = `
                            <div class="space-y-4">
                                <div class="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm font-medium border border-blue-100 flex justify-between items-center">
                                    <span>เจอข้อมูลที่ตรงเงื่อนไข:</span>
                                    <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs">${matches.length} matches</span>
                                </div>
                                <div class="space-y-3">
                        `;
                        
                        matches.forEach((item, idx) => {
                            const start = Math.max(0, item.index - 15);
                            const end = Math.min(inputText.length, item.index + item.fullMatch.length + 5);
                            const context = inputText.substring(start, end).replace(/\n/g, ' ');

                            html += `
                                <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Match #${idx + 1}</span>
                                        <span class="font-mono text-sm font-bold text-green-600 bg-green-50 px-2 py-1 rounded">
                                            ${escapeHtml(item.capturedValue)}
                                        </span>
                                    </div>
                                    <div class="text-xs text-gray-500 font-mono bg-gray-100 p-2 rounded break-all">
                                        <span class="opacity-50">...</span>
                                        ${escapeHtml(context)}
                                        <span class="opacity-50">...</span>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                        matchesContainer.innerHTML = html;
                    } else {
                        matchesContainer.innerHTML = `
                            <div class="text-center text-gray-500 py-10 h-full flex items-center justify-center">
                                ไม่พบข้อมูลที่ตรงกับเงื่อนไขใน Input นี้
                            </div>
                        `;
                    }

                    // --- 4. เตรียมข้อมูลสำหรับการแสดงผล JSON & Highlight ---
                    const rawWithMarkers = JSON.stringify(structuredOutput, null, 2);
                    
                    // นับจำนวน Diff ที่เปลี่ยน
                    const diffMatches = rawWithMarkers.match(/@@@_HL_START_@@@/g);
                    const diffCount = diffMatches ? diffMatches.length : 0;
                    
                    // 1. JSON ปกติ (ลบ Marker ออกให้หมด เพื่อเตรียมเอาไว้ Copy)
                    currentRawJsonString = rawWithMarkers.replace(/@@@_HL_START_@@@|@@@_HL_END_@@@/g, "");
                    currentNormalHtml = escapeHtml(currentRawJsonString);
                    
                    // 2. JSON Highlight (แปลง Marker เป็น HTML Tag สีเหลือง)
                    currentHighlightedHtml = escapeHtml(rawWithMarkers)
                        .replace(/@@@_HL_START_@@@/g, '<mark class="bg-red-300 text-black px-1 rounded-sm font-bold shadow-sm">')
                        .replace(/@@@_HL_END_@@@/g, '</mark>');

                    // อัปเดต UI JSON
                    updateJsonView();
                    
                    // จัดการ Badge และ Checkbox Show Diff
                    if (diffCount > 0) {
                        diffBadge.textContent = diffCount;
                        diffBadge.classList.remove('hidden');
                        showDiffToggle.disabled = false;
                        // เปิด Highlight ให้อัตโนมัติถ้ามีของเปลี่ยน (ถ้าต้องการให้ปิดเป็น default ให้ลบบรรทัดล่างออก)
                        showDiffToggle.checked = true; 
                        updateJsonView(); // เรียกซ้ำเพื่อ render ใหม่ตาม check
                    } else {
                        diffBadge.classList.add('hidden');
                        showDiffToggle.disabled = true;
                        showDiffToggle.checked = false;
                    }

                    // สร้างตาราง Summary Table
                    renderSummaryTable();

                    // ปลดล็อคปุ่ม Copy
                    copyBtn.disabled = false;

                } catch (err) {
                    currentRawJsonString = null;
                    currentNormalHtml = null;
                    currentSummaryData = []; // เคลียร์ตาราง
                    copyBtn.disabled = true;
                    showDiffToggle.disabled = true;
                    diffBadge.classList.add('hidden');
                    
                    matchesContainer.innerHTML = `
                        <div class="bg-red-50 text-red-700 p-4 rounded-lg border border-red-200 flex items-start gap-3">
                            <i data-lucide="alert-circle" class="shrink-0 mt-0.5 w-5 h-5"></i>
                            <div>
                                <p class="font-bold">เกิดข้อผิดพลาดในการรัน Regex</p>
                                <p class="text-sm mt-1 break-all">${escapeHtml(err.message)}</p>
                            </div>
                        </div>
                    `;
                    
                    jsonResultContainer.innerHTML = `
                        <div class="text-red-400 font-mono text-sm h-full flex items-center justify-center">
                            Error: ไม่สามารถแสดงผล JSON ได้เนื่องจาก Regex ผิดพลาด
                        </div>
                    `;
                    summarySection.classList.add('hidden'); // ซ่อน Summary ถ้ามี Error
                } finally {
                    runBtn.disabled = false;
                    runText.innerHTML = 'Run Regex';
                    runIcon.style.display = 'inline-block';
                    lucide.createIcons();
                }
            }, 50);
        });
    </script>
</body>
</html>
